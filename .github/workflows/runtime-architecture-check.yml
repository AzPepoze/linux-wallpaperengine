name: Runtime architecture check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxi-dev libvulkan-dev mesa-vulkan-drivers vulkan-tools xvfb xauth

      - name: Install prebuilt Slang
        env:
          SLANG_VERSION: '2026.14'
        run: |
          mkdir -p "$RUNNER_TEMP/slang"
          curl -fL --retry 3 -o "$RUNNER_TEMP/slang.tar.gz" "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64-glibc-2.27.tar.gz"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"
          SLANG_CONFIG="$(find "$RUNNER_TEMP/slang" -type f \( -name 'slangConfig.cmake' -o -name 'SlangConfig.cmake' \) -print -quit)"
          test -n "$SLANG_CONFIG"
          SLANG_PREFIX="$(realpath "$(dirname "$SLANG_CONFIG")/../../..")"
          echo "CMAKE_PREFIX_PATH=$SLANG_PREFIX${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$SLANG_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - uses: xmake-io/github-action-setup-xmake@v1

      - name: Validate architecture boundaries
        run: |
          test -f src/app/main.cpp
          test -f src/render/backend/sokol/sokol_implementation.cpp
          test -f src/formats/wallpaper_engine/scene/scene_document.h
          test -f src/formats/wallpaper_engine/texture/tex_decoder.h
          test -f src/wallpaper/scene/graph/scene_graph.h
          test -f src/wallpaper/scene/2d/scene_2d_runtime.cpp

          if grep -R -nE 'sokol_|SG_PIXELFORMAT|sg_pixel_format|vulkan' src/formats/wallpaper_engine; then
            echo 'Wallpaper Engine format layer depends on GPU/backend types'
            exit 1
          fi

          if grep -R -n 'cJSON' src/render; then
            echo 'Generic renderer still depends on Wallpaper Engine JSON parsing'
            exit 1
          fi

      - name: Configure
        run: xmake f -y -m release

      - name: Build
        run: xmake -v

      - name: Vulkan smoke
        run: xvfb-run -a vulkaninfo --summary

      - name: Runtime smoke
        run: |
          set +e
          timeout 5s xvfb-run -a ./bin/linux_wallpaperengine > runtime.log 2>&1
          status=$?
          set -e
          cat runtime.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if grep -E 'Slang diagnostics|Slang failed|Failed to create shader|VALIDATE_' runtime.log; then
            exit 1
          fi
