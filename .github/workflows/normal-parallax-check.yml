name: Normal parallax check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxi-dev libvulkan-dev mesa-vulkan-drivers vulkan-tools xvfb xauth
      - name: Install prebuilt Slang
        env:
          SLANG_VERSION: '2026.14'
        run: |
          mkdir -p "$RUNNER_TEMP/slang"
          curl -fL --retry 3 -o "$RUNNER_TEMP/slang.tar.gz" "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64-glibc-2.27.tar.gz"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"
          SLANG_CONFIG="$(find "$RUNNER_TEMP/slang" -type f \( -name 'slangConfig.cmake' -o -name 'SlangConfig.cmake' \) -print -quit)"
          test -n "$SLANG_CONFIG"
          SLANG_PREFIX="$(realpath "$(dirname "$SLANG_CONFIG")/../../..")"
          echo "CMAKE_PREFIX_PATH=$SLANG_PREFIX${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$SLANG_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
      - name: Verify normal parallax source
        run: |
          grep -n 'parallax_update(ctx' src/main.cpp
          grep -n 'parallax_layer_offset' src/scene/2d/image_layer.cpp
          grep -n 'parallax_layer_offset' src/scene/2d/particle_layer.cpp
          grep -n 'origin\[0\] - camera_x + mouse_x' src/scene/parallax.cpp
          grep -n 'origin\[1\] - camera_y + mouse_y' src/scene/parallax.cpp
          grep -n 'camera_parallax_mouse_influence' src/scene/parallax.cpp
          grep -n 'parallax_smooth_y = (shader_position.y - 0.5f) \* 2.0f' src/scene/parallax.cpp
          if grep -n 'kParallaxScale' src/scene/2d/image_layer.cpp src/scene/2d/particle_layer.cpp; then
            echo "Legacy fixed parallax scale is still active in a layer path"
            exit 1
          fi
      - name: Configure
        run: xmake f -y -m release
      - name: Build
        run: xmake -v
      - name: Vulkan smoke
        run: xvfb-run -a vulkaninfo --summary
      - name: Runtime smoke
        run: |
          set +e
          timeout 5s xvfb-run -a ./bin/linux_wallpaperengine > runtime.log 2>&1
          status=$?
          set -e
          cat runtime.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if grep -E "Slang diagnostics|Slang failed|Failed to create shader|VALIDATE_" runtime.log; then
            exit 1
          fi
