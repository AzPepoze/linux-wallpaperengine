name: Effect runtime validation

on:
  push:
    branches:
      - feat/full-effect-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-effect-runtime

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxi-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-tools xvfb xauth cppcheck clang-format

      - name: Install prebuilt Slang
        env:
          SLANG_VERSION: '2026.14'
        run: |
          mkdir -p "$RUNNER_TEMP/slang"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/slang.tar.gz" \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64-glibc-2.27.tar.gz"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"

          SLANG_CONFIG="$(find "$RUNNER_TEMP/slang" -type f \( -name 'slangConfig.cmake' -o -name 'SlangConfig.cmake' \) -print -quit)"
          test -n "$SLANG_CONFIG"
          SLANG_PREFIX="$(realpath "$(dirname "$SLANG_CONFIG")/../../..")"

          echo "CMAKE_PREFIX_PATH=$SLANG_PREFIX${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$SLANG_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$SLANG_PREFIX/bin/slangc" -version

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Format changed source files
        run: |
          git diff --name-only origin/main...HEAD -- 'src/**/*.cpp' 'src/**/*.h' > /tmp/effect-source-files.txt
          if [ -s /tmp/effect-source-files.txt ]; then
            xargs clang-format -i < /tmp/effect-source-files.txt
          fi

          if ! git diff --quiet -- src/; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            xargs git add -- < /tmp/effect-source-files.txt
            git commit -m 'style: format effect runtime implementation'
            git push origin HEAD:feat/full-effect-runtime
          fi

      - name: Verify generic effect source
        run: |
          ! grep -n 'Ignoring unsupported effect' src/wallpaper/scene/2d/effects/effect.cpp
          grep -n 'jsonToFloats' src/wallpaper/scene/2d/effects/effect.cpp
          grep -n 'readCombos' src/wallpaper/scene/2d/effects/effect.cpp
          grep -n 'source_slot = 1' src/wallpaper/scene/2d/effects/pass_textures.cpp
          grep -n '#define float2 vec2' src/render/shader/shader_processor.cpp

      - name: Format check
        run: find src/ -name '*.[ch]*' | xargs clang-format --dry-run --Werror

      - name: Static analysis
        run: |
          cppcheck -j 8 --quiet --enable=warning --error-exitcode=1 \
            '-D__has_feature(x)=0' \
            --suppress=preprocessorErrorDirective \
            --suppress='*:libs/*' \
            src/

      - name: Configure
        run: xmake f -y -m release

      - name: Build
        run: xmake -v

      - name: Check software Vulkan
        run: xvfb-run -a vulkaninfo --summary

      - name: Smoke test Vulkan runtime
        run: |
          set +e
          timeout 5s xvfb-run -a ./bin/linux_wallpaperengine > runtime.log 2>&1
          status=$?
          set -e
          cat runtime.log

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          if grep -E "Slang diagnostics|Slang failed|Failed to create shader|Failed to initialize Slang|VALIDATE_" runtime.log; then
            echo "Vulkan/Slang runtime smoke failed"
            exit 1
          fi
