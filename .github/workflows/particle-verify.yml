name: Particle verification

on:
  push:
    branches:
      - feat/particles
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang-format cppcheck \
            libvulkan-dev libx11-dev libxcursor-dev libxi-dev liblz4-dev

      - name: Install Slang
        run: |
          git clone --depth 1 https://github.com/shader-slang/slang.git /tmp/slang
          cmake -S /tmp/slang -B /tmp/slang-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSLANG_ENABLE_SLANGD=OFF \
            -DSLANG_ENABLE_GFX=OFF \
            -DSLANG_ENABLE_TESTS=OFF \
            -DSLANG_ENABLE_EXAMPLES=OFF
          cmake --build /tmp/slang-build --target install -j2

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Static checks
        run: xmake check

      - name: Configure debug build
        run: xmake f -m debug -y

      - name: Build
        run: xmake build linux-wallpaperengine -vD
