name: Vulkan waterwaves fix check

on:
  push:
    branches:
      - agent/vulkan-backend
  pull_request:
    branches:
      - c-sokol

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxi-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-tools xvfb xauth

      - name: Install prebuilt Slang
        env:
          SLANG_VERSION: '2026.14'
        run: |
          mkdir -p "$RUNNER_TEMP/slang"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/slang.tar.gz" \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64-glibc-2.27.tar.gz"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"
          SLANG_CONFIG="$(find "$RUNNER_TEMP/slang" -type f \( -name 'slangConfig.cmake' -o -name 'SlangConfig.cmake' \) -print -quit)"
          test -n "$SLANG_CONFIG"
          SLANG_PREFIX="$(realpath "$(dirname "$SLANG_CONFIG")/../../..")"
          echo "CMAKE_PREFIX_PATH=$SLANG_PREFIX${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$SLANG_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$SLANG_PREFIX/bin/slangc" -version

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Verify waterwaves fixes
        run: |
          grep -n 'virtual_source_name' src/render/shader_backend.cpp
          grep -n 'g_Time' src/render/shader_compiler.cpp
          grep -n 'fragment_uniforms' src/render/render.cpp
          grep -n 'set_combo_define("MASK", 1)' src/render/effect.cpp
          grep -n 'set_combo_define("TIMEOFFSET", 1)' src/render/effect.cpp
          if grep -R -n -E 'SOKOL_GLCORE|LWE_SOKOL_VULKAN|add_syslinks\("GL"' src xmake.lua; then
            echo "Legacy OpenGL backend path is still present"
            exit 1
          fi

      - name: Configure
        run: xmake f -y -m release

      - name: Build
        run: xmake -v

      - name: Check software Vulkan
        run: xvfb-run -a vulkaninfo --summary

      - name: Smoke test Vulkan runtime
        run: |
          set +e
          timeout 5s xvfb-run -a ./bin/linux_wallpaperengine > runtime.log 2>&1
          status=$?
          set -e
          cat runtime.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if grep -E "Slang diagnostics|Slang failed|Failed to create shader|Failed to initialize Slang|VALIDATE_" runtime.log; then
            echo "Vulkan/Slang runtime smoke failed"
            exit 1
          fi
