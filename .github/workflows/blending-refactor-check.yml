name: Blending refactor validation

on:
  push:
    branches:
      - refactor/wallpaper-engine-blending
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxi-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-tools xvfb xauth cppcheck clang-format

      - name: Check formatting
        run: find src -name '*.[ch]*' | xargs clang-format --dry-run --Werror

      - name: Run static analysis
        run: |
          cppcheck -j 8 --quiet --enable=warning --error-exitcode=1 \
            '-D__has_feature(x)=0' \
            --suppress=preprocessorErrorDirective \
            --suppress=uninitMemberVarNoCtor \
            src/

      - name: Install prebuilt Slang
        env:
          SLANG_VERSION: '2026.14'
        run: |
          mkdir -p "$RUNNER_TEMP/slang"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/slang.tar.gz" \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64-glibc-2.27.tar.gz"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"

          SLANG_CONFIG="$(find "$RUNNER_TEMP/slang" -type f \( -name 'slangConfig.cmake' -o -name 'SlangConfig.cmake' \) -print -quit)"
          test -n "$SLANG_CONFIG"
          SLANG_PREFIX="$(realpath "$(dirname "$SLANG_CONFIG")/../../..")"

          echo "CMAKE_PREFIX_PATH=$SLANG_PREFIX${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$SLANG_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$SLANG_PREFIX/bin/slangc" -version

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Verify Wallpaper Engine blending source
        run: |
          grep -n 'common_blending.h' src/render/render.cpp
          grep -n 'ApplyBlending(BLENDMODE' src/render/render.cpp
          grep -n 'processShaderSource' src/render/render.cpp
          ! grep -n 'vec3 rgb2hsl' src/render/render.cpp
          ! grep -n 'return mix(b,b\*s,o)' src/render/render.cpp

      - name: Configure
        run: xmake f -y -m release

      - name: Build
        run: xmake -v

      - name: Check software Vulkan
        run: xvfb-run -a vulkaninfo --summary
